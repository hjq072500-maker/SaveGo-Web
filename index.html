<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SaveGo V7.0 AI购物生态</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
Arial,
"Microsoft YaHei";

background:#f4f7fb;

padding-bottom:80px;

}



header{

background:
linear-gradient(135deg,#111827,#2563eb);

color:white;

padding:40px 20px;

text-align:center;

}


header h1{

font-size:36px;

margin:10px;

}



header p{

font-size:18px;

}





.search-box{

background:white;

margin:20px;

padding:20px;

border-radius:25px;

}



.search-box input{

width:75%;

padding:15px;

border-radius:15px;

border:1px solid #ddd;

font-size:16px;

}



.search-box button{

padding:15px;

border:none;

border-radius:15px;

background:#2563eb;

color:white;

}





.card{

background:white;

margin:20px;

padding:25px;

border-radius:25px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

}



.score{

color:#2563eb;

font-size:22px;

font-weight:bold;

}



.price{

font-size:34px;

color:#ef4444;

font-weight:bold;

}




.platform{

display:flex;

justify-content:space-between;

padding:10px;

background:#f8fafc;

margin-top:10px;

border-radius:10px;

}



.ai{

background:#111827;

color:white;

}



.button{

display:inline-block;

background:#2563eb;

color:white;

padding:12px 20px;

border-radius:20px;

}





.nav{

position:fixed;

bottom:0;

left:0;

width:100%;

background:white;

display:flex;

justify-content:space-around;

padding:18px;

box-shadow:
0 -5px 20px #ddd;

}


</style>


</head>



<body>

🚀 SaveGo AI
</h1>


<p>
V7.0 智能购物生态平台
</p>


<p>
比价 · 预测 · AI决策
</p>


</header>





<div class="search-box">


<input
id="keyword"
placeholder="搜索商品，例如 iPhone 16 Pro">


<button onclick="search()">

搜索

</button>


</div>






<div id="products">





<div class="card">


<h2>
📱 iPhone 16 Pro
</h2>


<div class="score">

SaveGo评分 92

</div>


<div class="price">

¥7399

</div>


<div class="platform">

<span>
淘宝
</span>

<span>
¥7399
</span>

</div>



<div class="platform">

<span>
京东
</span>

<span>
¥7499
</span>

</div>



<div class="platform">

<span>
亚马逊
</span>

<span>
¥7599
</span>

</div>



</div>





</div>







<div class="card ai">


<h2>
🤖 AI购物助手
</h2>


<p>

告诉我预算和需求，
我帮你选择商品。

</p>


<div class="button">

开始分析

</div>


</div>






<div class="card">


<h2>
📊 价格趋势
</h2>


<p>

30天价格预测：

</p>


<h3>

可能下降 5%

</h3>


</div>







<div class="nav">


<span>
首页
</span>


<span>
搜索
</span>


<span>
AI
</span>


<span>
我的
</span>


</div>




<script>


function search(){


let key =
document.getElementById("keyword").value;


alert(

);

</body>

</html>
