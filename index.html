<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SaveGo V6.2 数据智能版</title>

<style>

body{
font-family:Arial,"Microsoft YaHei";
background:#f3f6fb;
margin:0;
padding-bottom:70px;
}

header{
background:#111827;
color:white;
padding:25px;
text-align:center;
}

.search{
margin:20px;
background:white;
padding:15px;
border-radius:16px;
}

input{
width:90%;
padding:12px;
border:0;
font-size:16px;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:18px;
box-shadow:0 5px 20px #ddd;
}

.price{
font-size:30px;
color:#ef4444;
font-weight:bold;
}

.btn{
background:#111827;
color:white;
padding:12px;
border-radius:12px;
display:inline-block;
}

.nav{
position:fixed;
bottom:0;
width:100%;
background:white;
padding:15px;
display:flex;
justify-content:space-around;
}

</style>

</head>


<body>


<header>

<h1>🚀 SaveGo AI</h1>

<p>智能比价与购物决策平台 V6.2</p>

</header>



<div class="search">

<input placeholder="搜索商品，例如 手机、电脑">

</div>



<div class="card">

<h2>📱 iPhone 16 Pro</h2>

<p>SaveGo评分：92分</p>

<div class="price">
¥7499
</div>

<p>
最低价格：3个平台比较
</p>


<div class="btn">
❤️ 收藏
</div>


</div>




<div class="card">

<h2>🤖 AI购物助手</h2>

<p>
输入预算和需求，
AI帮助选择最佳商品。
</p>


<div class="btn">
开始分析
</div>


</div>



<div class="card">

<h2>📉 降价提醒</h2>

<p>
目标价格：¥6999
</p>

<p>
状态：监控中
</p>

</div>



<div class="nav">

<span>首页</span>

<input 
id="searchInput"
placeholder="搜索商品，例如 手机、电脑">


<button onclick="searchProduct()">
搜索
</button>


<div id="result"></div>

<span>AI</span>

<span>我的</span>

</div>

<script src="app.js"></script>
</body>

</html>
